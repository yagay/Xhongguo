name: Debug APK

on:
  push:
    branches: [main, beta, feature/module-settings-app]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager is missing"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prevent legacy profile fallback
        run: python3 tools/verify_universal_mapping.py
      # Compile the app first: a failed unit test must not masquerade as a
      # Kotlin APK compilation failure. Keep each complete Gradle log.
      - name: Build Debug only
        shell: bash
        run: |
          set +e
          bash ./gradlew :app:assembleDebug --stacktrace --console=plain \
            2>&1 | tee debug-build.log
          build_code=${PIPESTATUS[0]}
          {
            echo "### Debug APK compile: $([ "$build_code" -eq 0 ] && echo PASS || echo FAIL)"
            echo '\`\`\`text'
            grep -E '(^(e:|error:)|^FAILURE:|^Execution failed for task|^> Task.*FAILED|^\* What went wrong:|^> .*not found|^> .*Unresolved reference)' debug-build.log | tail -n 45 || true
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$build_code"
      - name: Run beta unit tests
        shell: bash
        run: |
          set +e
          bash ./gradlew :app:testDebugUnitTest --stacktrace --console=plain \
            2>&1 | tee debug-unit-tests.log
          test_code=${PIPESTATUS[0]}
          {
            echo "### Debug unit tests: $([ "$test_code" -eq 0 ] && echo PASS || echo FAIL)"
            echo '\`\`\`text'
            grep -E '(^(e:|error:)|^FAILURE:|^Execution failed for task|^> Task.*FAILED|^There were failing tests)' debug-unit-tests.log | tail -n 25 || true
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_code"
      - name: Upload build diagnostic logs even when Gradle fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xhongguo-beta-build-diagnostics
          path: |
            debug-build.log
            debug-unit-tests.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xhongguo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
