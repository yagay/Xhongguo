plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.yagay.xhongguo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yagay.xhongguo'
        minSdk 29
        targetSdk 34
        def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionCode 20261128 + runNumber
        versionName "1.1.0-test" + (runNumber > 0 ? "." + runNumber : "")
        def revision = (System.getenv('GITHUB_SHA') ?: 'local').take(12)
        buildConfigField 'String', 'BUILD_CHANNEL', '"test"'
        buildConfigField 'String', 'BUILD_REVISION', '"' + revision + '"'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        resConfigs("zh", "en")
    }

    buildFeatures {
        buildConfig = true
    }

    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def hasSigning = keystorePropsFile.exists() &&
        !keystoreProps.getProperty('storeFile', '').isBlank() &&
        !keystoreProps.getProperty('storePassword', '').isBlank() && keystoreProps.getProperty('storePassword', '') != 'FILL_ME' &&
        !keystoreProps.getProperty('keyAlias', '').isBlank() &&
        !keystoreProps.getProperty('keyPassword', '').isBlank() && keystoreProps.getProperty('keyPassword', '') != 'FILL_ME'
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (hasSigning) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }

    packaging {
        resources {
            merges += ['META-INF/xposed/*']
            excludes += ['**']
        }
    }
}

dependencies {
    compileOnly libs.libxposed.api
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
}
